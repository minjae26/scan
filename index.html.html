<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>분류 스캔</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --line:#e2e5e9; --text:#1b2127; --muted:#6b7480;
          --ok:#1f8a4c; --okbg:#e7f6ec; --dup:#b7791f; --dupbg:#fdf3e1; --err:#d92d20; --errbg:#fdecea; --accent:#2f5fd0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-size:15px;
         font-family:-apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; position:sticky; top:0; z-index:5; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  h1 { font-size:17px; margin:0; }
  .live { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#bbb; }
  .dot.on { background:var(--ok); } .dot.bad { background:var(--err); }
  .bar { height:8px; background:#e8ebef; border-radius:99px; overflow:hidden; margin-top:8px; }
  .bar i { display:block; height:100%; background:var(--ok); width:0; transition:width .3s; }
  .prog { display:flex; justify-content:space-between; font-size:13px; margin-top:4px; color:var(--muted); }
  .prog b { color:var(--text); }
  main { max-width:820px; margin:0 auto; padding:14px 16px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .row { display:flex; gap:8px; align-items:center; }
  input, select { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; width:100%; background:#fff; }
  button { font:inherit; padding:10px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; white-space:nowrap; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  #scanInput { font-size:18px; padding:14px; }
  #reader { margin-top:10px; border-radius:8px; overflow:hidden; background:#000; }
  #reader video { width:100% !important; max-height:40vh; object-fit:cover; display:block; }
  button.cam { font-size:16px; padding:12px 16px; }
  #scanInput { flex:1; min-width:0; }
  @media (max-width:520px) { #scanInput { font-size:15px; padding:12px; } }
  .result { border-radius:12px; padding:18px; text-align:center; border:2px solid var(--line); background:var(--card); min-height:150px; }
  .result.ok { border-color:var(--ok); background:var(--okbg); }
  .result.dup { border-color:var(--dup); background:var(--dupbg); }
  .result.err { border-color:var(--err); background:var(--errbg); }
  .result.wait { border-color:var(--accent); }
  .r-status { font-size:14px; font-weight:700; letter-spacing:.02em; }
  .ok .r-status { color:var(--ok); } .dup .r-status { color:var(--dup); } .err .r-status { color:var(--err); } .wait .r-status { color:var(--accent); }
  .r-label { font-size:clamp(40px, 11vw, 68px); font-weight:800; line-height:1.1; margin:8px 0 4px; word-break:break-all; }
  .r-addr { font-size:18px; font-weight:600; line-height:1.4; }
  .r-sub { color:var(--muted); font-size:13px; margin-top:6px; }
  .r-actions { margin-top:10px; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button { flex:1; }
  .tabs button.on { background:var(--text); color:#fff; border-color:var(--text); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-size:12px; color:var(--muted); font-weight:500; }
  .num { text-align:right; white-space:nowrap; }
  .mini { height:6px; background:#e8ebef; border-radius:99px; overflow:hidden; min-width:60px; }
  .mini i { display:block; height:100%; background:var(--ok); }
  .sub { color:var(--muted); font-size:12px; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px; color:#fff; }
  .tag.스캔 { background:var(--ok); } .tag.취소 { background:var(--err); }
  .done td { color:var(--muted); }
  tr.click { cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:20px 0; }
  dialog { border:0; border-radius:12px; padding:0; width:min(560px,94vw); max-height:85vh; }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  .dlg { padding:16px; }
  .dlg-body { max-height:60vh; overflow:auto; }
  .flash { animation: flash .5s; } @keyframes flash { from { transform:scale(1.02); } to { transform:scale(1); } }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>분류 스캔</h1>
    <div class="live"><span class="dot" id="dot"></span><span id="sync">연결 중…</span></div>
    <div class="row" style="gap:6px">
      <button id="whoBtn" title="작업자 변경">👤 <span id="whoName">-</span></button>
      <button id="connBtn" title="연결 설정">⚙</button>
    </div>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="prog"><span>전체 <b id="pDone">0</b> / <b id="pTotal">0</b></span><span id="pPct">0%</span></div>
</header>

<main>
  <div class="card">
    <div class="row">
      <button id="camBtn" class="primary cam">📷 카메라</button>
      <button id="torchBtn" hidden>🔦 플래시</button>
      <input id="scanInput" placeholder="송장번호 직접 입력 후 Enter" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="numeric">
    </div>
    <div id="reader" hidden></div>
    <div class="sub" id="camHint" style="margin-top:6px">바코드를 가로로 화면 가운데 상자에 맞추면 자동으로 인식됩니다.</div>
  </div>

  <div class="result" id="result">
    <div class="r-status">대기 중</div>
    <div class="r-sub">바코드를 스캔하면 경유지와 주소가 표시됩니다</div>
  </div>
  <div style="height:12px"></div>

  <div class="tabs">
    <button class="on" data-tab="feed">실시간 피드</button>
    <button data-tab="orders">오더별 진행</button>
  </div>

  <div class="card" id="tab-feed">
    <table><thead><tr><th>시각</th><th>라벨</th><th>작업자</th></tr></thead><tbody id="feedBody"></tbody></table>
  </div>

  <div class="card" id="tab-orders" hidden>
    <div class="row" style="margin-bottom:8px">
      <input id="orderSearch" placeholder="오더번호 / 파트너 검색">
      <select id="orderFilter" style="width:auto"><option value="todo">미완료</option><option value="all">전체</option><option value="done">완료</option></select>
    </div>
    <table><thead><tr><th>오더</th><th>진행</th><th class="num">완료</th></tr></thead><tbody id="orderBody"></tbody></table>
  </div>
</main>

<dialog id="orderDlg"><div class="dlg">
  <div class="row" style="justify-content:space-between"><h3 id="dlgTitle" style="margin:0"></h3><button id="dlgClose">닫기</button></div>
  <div class="dlg-body" style="margin-top:10px"><table><thead><tr><th>경유지</th><th>주소</th><th>상태</th></tr></thead><tbody id="dlgBody"></tbody></table></div>
</div></dialog>

<dialog id="connDlg"><form class="dlg" id="connForm" method="dialog">
  <h3 style="margin:0 0 6px">구글 시트 연결</h3>
  <div class="sub" style="margin-bottom:10px">관리자에게 받은 <b>연결 링크</b>로 접속하면 자동으로 채워집니다.</div>
  <label class="sub">웹 앱 URL</label>
  <input id="connUrl" required placeholder="https://script.google.com/macros/s/…/exec" style="margin:4px 0 10px">
  <label class="sub">비밀 키</label>
  <input id="connKey" required autocomplete="off" style="margin-top:4px">
  <div class="row" style="justify-content:flex-end; margin-top:12px">
    <button type="button" id="connCancel">닫기</button><button class="primary" type="submit">연결</button>
  </div>
</form></dialog>

<dialog id="whoDlg"><form class="dlg" id="whoForm" method="dialog">
  <h3 style="margin:0 0 6px">작업자 이름</h3>
  <div class="sub" style="margin-bottom:10px">스캔 기록에 남고 다른 작업자 화면에 표시됩니다.</div>
  <input id="whoInput" required placeholder="예) 노민재">
  <div class="row" style="justify-content:flex-end; margin-top:12px"><button class="primary" type="submit">시작</button></div>
</form></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isDesktop = window.matchMedia('(pointer:fine)').matches;
const POLL_MS = 3000;

const S = {
  byInv: new Map(),      // 신청서번호 -> row
  byLabel: new Map(),    // 제품명(S) 대문자 -> row
  orders: new Map(),     // 오더번호 -> {order, prefix, rows[]}
  logN: 0, feed: [], who: '', lastResultInv: '', polling: false, lastSync: 0, failCount: 0,
};

/* ───────── 구글 시트 연결 (Apps Script 연결 창구) ─────────
 * 연결 링크 형식: https://<이 페이지 주소>/#u=<웹앱 URL>&k=<비밀 키>
 * 링크로 한 번 열면 이 기기에 저장되고, 주소창에서는 키가 지워집니다.
 */
const CFG = { url: '', key: '' };
(function readConfig() {
  try { CFG.url = localStorage.getItem('sort_api_url') || ''; CFG.key = localStorage.getItem('sort_api_key') || ''; } catch (e) {}
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('u') && h.get('k')) {
    CFG.url = h.get('u').trim(); CFG.key = h.get('k').trim();
    try { localStorage.setItem('sort_api_url', CFG.url); localStorage.setItem('sort_api_key', CFG.key); } catch (e) {}
    history.replaceState(null, '', location.pathname + location.search);
  }
})();

const API_ARGS = { getAll: [], scan: ['code', 'who'], cancelScan: ['inv', 'who'], getUpdates: ['n'] };
async function run(fn, ...args) {
  if (!CFG.url || !CFG.key) throw new Error('연결 정보가 없습니다. 관리자에게 받은 연결 링크로 접속하세요.');
  const p = new URLSearchParams({ action: fn, key: CFG.key, t: Date.now() });
  API_ARGS[fn].forEach((k, i) => p.set(k, args[i] ?? ''));
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    const res = await fetch(CFG.url + (CFG.url.includes('?') ? '&' : '?') + p, { redirect: 'follow', signal: ctrl.signal });
    const text = await res.text();
    let j;
    try { j = JSON.parse(text); }
    catch (e) { throw new Error('구글 응답을 읽지 못했습니다. 웹 앱 액세스 권한이 "모든 사용자"인지 확인하세요.'); }
    if (!j.ok) throw new Error(j.error);
    return j.data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('응답이 늦습니다. 네트워크를 확인하세요.');
    throw e;
  } finally { clearTimeout(timer); }
}

function openConnDialog() {
  $('#connUrl').value = CFG.url; $('#connKey').value = CFG.key;
  $('#connDlg').showModal();
}

let actx;
function beep(kind) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const tones = { ok: [1300, .09], dup: [600, .18], err: [260, .35] }[kind];
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = tones[0]; g.gain.value = .1; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + tones[1]);
    if (navigator.vibrate && kind !== 'ok') navigator.vibrate(kind === 'err' ? [120, 60, 120] : 150);
  } catch (e) {}
}

/* ───────── 데이터 ───────── */
function prefixOf(label) { const s = String(label); const i = s.lastIndexOf('-'); return i > 0 ? s.slice(0, i) : s; }

function loadRows(rows) {
  S.byInv.clear(); S.byLabel.clear(); S.orders.clear();
  rows.forEach(a => {
    const r = { row: a[0], inv: a[1], order: a[2], stop: a[3], label: a[4], addr: a[5], name: a[6], scanned: !!a[7], at: a[8], by: a[9] };
    S.byInv.set(r.inv, r);
    if (r.label) S.byLabel.set(r.label.toUpperCase(), r);
    if (!S.orders.has(r.order)) S.orders.set(r.order, { order: r.order, prefix: prefixOf(r.label), rows: [] });
    S.orders.get(r.order).rows.push(r);
  });
  S.orders.forEach(o => o.rows.sort((a, b) => (+a.stop || 0) - (+b.stop || 0)));
}

async function loadAll() {
  setSync('불러오는 중…');
  const d = await run('getAll');
  loadRows(d.rows);
  S.logN = d.logCount;
  S.lastSync = Date.now(); S.failCount = 0;
  renderAll();
}

function findLocal(code) {
  return S.byInv.get(code) || S.byLabel.get(code.toUpperCase()) || null;
}
function orderStat(order) {
  const o = S.orders.get(order); if (!o) return { done: 0, total: 0 };
  return { done: o.rows.filter(r => r.scanned).length, total: o.rows.length };
}

/* ───────── 렌더 ───────── */
function renderProgress() {
  let done = 0, total = 0;
  S.byInv.forEach(r => { total++; if (r.scanned) done++; });
  $('#pDone').textContent = done.toLocaleString(); $('#pTotal').textContent = total.toLocaleString();
  const pct = total ? Math.floor(done / total * 1000) / 10 : 0;
  $('#pPct').textContent = pct + '%'; $('#barFill').style.width = pct + '%';
}

function showResult(kind, r, extra) {
  const el = $('#result');
  el.className = 'result ' + kind + ' flash';
  void el.offsetWidth; el.classList.add('flash');
  const title = { ok: '✓ 스캔 완료', dup: '⚠ 이미 스캔됨', err: '✕ 찾을 수 없음', wait: '확인 중…' }[kind];
  if (!r) {
    el.innerHTML = `<div class="r-status">${title}</div><div class="r-label" style="font-size:28px">${esc(extra || '')}</div>
      <div class="r-sub">시트에 없는 바코드입니다. 송장번호를 확인하세요.</div>`;
    return;
  }
  const st = orderStat(r.order);
  const dupLine = kind === 'dup' ? `<div class="r-sub"><b>${esc(r.by || '다른 작업자')}</b> · ${esc(r.at)} 에 스캔</div>` : '';
  el.innerHTML = `<div class="r-status">${title}</div>
    <div class="r-label">${esc(r.label || (r.order + '-' + r.stop))}</div>
    <div class="r-addr">${esc(r.addr)}</div>
    ${dupLine}
    <div class="r-sub">${esc(r.name)} · 송장 ${esc(r.inv)} · 경유지 ${esc(r.stop)} / ${st.total} · 오더 진행 ${st.done}/${st.total}</div>
    ${kind === 'ok' ? `<div class="r-actions"><button id="undoBtn">스캔 취소</button></div>` : ''}`;
  const u = $('#undoBtn'); if (u) u.onclick = () => undo(r.inv);
}

function renderFeed() {
  $('#feedBody').innerHTML = S.feed.slice(0, 40).map(e => {
    const r = S.byInv.get(e.inv);
    return `<tr><td class="sub">${esc(e.at)}</td>
      <td><span class="tag ${esc(e.type)}">${esc(e.type)}</span> <b>${esc(r ? r.label : e.inv)}</b>
        <div class="sub">${esc(r ? r.addr : '')}</div></td><td>${esc(e.who)}</td></tr>`;
  }).join('') || `<tr><td colspan="3" class="empty">아직 스캔 내역이 없습니다</td></tr>`;
}

function renderOrders() {
  const q = $('#orderSearch').value.trim().toLowerCase(), f = $('#orderFilter').value;
  const list = [...S.orders.values()].map(o => ({ o, ...orderStat(o.order) }))
    .filter(x => (!q || x.o.order.includes(q) || x.o.prefix.toLowerCase().includes(q)) &&
      (f === 'all' || (f === 'done' ? x.done === x.total : x.done < x.total)))
    .sort((a, b) => (a.done === a.total) - (b.done === b.total) || a.o.order.localeCompare(b.o.order));
  $('#orderBody').innerHTML = list.map(x => `<tr class="click ${x.done === x.total ? 'done' : ''}" data-o="${esc(x.o.order)}">
      <td><b>${esc(x.o.order)}</b><div class="sub">${esc(x.o.prefix)}</div></td>
      <td><div class="mini"><i style="width:${x.total ? x.done / x.total * 100 : 0}%"></i></div></td>
      <td class="num">${x.done} / ${x.total}</td></tr>`).join('') || `<tr><td colspan="3" class="empty">해당 오더가 없습니다</td></tr>`;
  $('#orderBody').querySelectorAll('tr[data-o]').forEach(tr => tr.onclick = () => openOrder(tr.dataset.o));
}

function openOrder(order) {
  const o = S.orders.get(order); if (!o) return;
  const st = orderStat(order);
  $('#dlgTitle').textContent = `${order} · ${o.prefix} (${st.done}/${st.total})`;
  const rows = [...o.rows].sort((a, b) => a.scanned - b.scanned || (+a.stop) - (+b.stop));
  $('#dlgBody').innerHTML = rows.map(r => `<tr class="${r.scanned ? 'done' : ''}"><td><b>${esc(r.label)}</b></td>
      <td>${esc(r.addr)}<div class="sub">${esc(r.name)} · ${esc(r.inv)}</div></td>
      <td>${r.scanned ? `✓ ${esc(r.by)}<div class="sub">${esc(r.at)}</div>` : '<span style="color:var(--err)">미스캔</span>'}</td></tr>`).join('');
  $('#orderDlg').showModal();
  S.openOrder = order;
}
$('#dlgClose').onclick = () => { $('#orderDlg').close(); S.openOrder = null; refocus(); };

function renderAll() {
  renderProgress(); renderFeed();
  if (!$('#tab-orders').hidden) renderOrders();
  if (S.openOrder && $('#orderDlg').open) openOrder(S.openOrder);
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('#tab-feed').hidden = b.dataset.tab !== 'feed';
  $('#tab-orders').hidden = b.dataset.tab !== 'orders';
  if (b.dataset.tab === 'orders') renderOrders();
  refocus();
});
$('#orderSearch').oninput = renderOrders;
$('#orderFilter').onchange = renderOrders;

/* ───────── 스캔 ───────── */
function refocus() {
  if (isDesktop && !$('#orderDlg').open && !$('#whoDlg').open && !$('#connDlg').open) $('#scanInput').focus();
}

async function doScan(raw) {
  const code = String(raw).trim(); if (!code) return;
  if (!S.who) { askWho(); return; }
  const local = findLocal(code);

  // 로컬 데이터로 즉시 표시 (서버 응답 전에 라벨·주소가 바로 보이도록)
  if (local && local.scanned) { showResult('dup', local); beep('dup'); return; }
  if (local) showResult('wait', local);

  try {
    const res = await run('scan', code, S.who);
    if (res.status === 'notfound') { showResult('err', null, code); beep('err'); return; }
    const r = S.byInv.get(res.info.inv) || local;
    if (r) Object.assign(r, { scanned: !!res.info.scanned, at: res.info.at, by: res.info.by });
    if (res.status === 'ok') {
      S.feed.unshift({ at: res.info.at, type: '스캔', inv: res.info.inv, who: S.who, mine: true });
      showResult('ok', r || res.info); beep('ok');
    } else { showResult('dup', r || res.info); beep('dup'); }
    renderAll();
  } catch (e) {
    showResult('err', local, code);
    $('#result').querySelector('.r-sub').textContent = '서버 오류: ' + (e.message || e) + ' — 다시 스캔하세요.';
    beep('err');
  }
}

async function undo(inv) {
  if (!confirm('이 스캔을 취소할까요?')) return;
  try {
    const res = await run('cancelScan', inv, S.who);
    const r = S.byInv.get(inv);
    if (r && res.status === 'ok') {
      Object.assign(r, { scanned: false, at: '', by: '' });
      S.feed.unshift({ at: new Date().toTimeString().slice(0, 8), type: '취소', inv, who: S.who, mine: true });
      $('#result').className = 'result'; $('#result').innerHTML = `<div class="r-status">스캔 취소됨</div><div class="r-label" style="font-size:32px">${esc(r.label)}</div>`;
    }
    renderAll();
  } catch (e) { alert(e.message || e); }
  refocus();
}

$('#scanInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const v = e.target.value; e.target.value = ''; doScan(v); }
});
document.addEventListener('click', e => {
  if (!e.target.closest('input,select,button,dialog,tr.click')) refocus();
});

/* ───────── 휴대폰 카메라 스캔 ───────── */
let cam = null, lastCode = '', lastAt = 0, torchOn = false;

function camConfig() {
  const F = window.Html5QrcodeSupportedFormats || {};
  const formats = ['CODE_128', 'CODE_39', 'CODE_93', 'EAN_13', 'EAN_8', 'ITF', 'CODABAR', 'QR_CODE']
    .map(k => F[k]).filter(v => v !== undefined);
  return {
    verbose: false,
    formatsToSupport: formats.length ? formats : undefined,
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }, // 안드로이드 크롬 고속 인식
  };
}

async function startCam() {
  if (typeof Html5Qrcode === 'undefined') { showCamError('스캐너 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'); return; }
  $('#reader').hidden = false;
  cam = new Html5Qrcode('reader', camConfig());
  try {
    await cam.start(
      { facingMode: 'environment' },
      {
        fps: 15,
        qrbox: (w, h) => ({ width: Math.floor(w * 0.9), height: Math.floor(Math.min(h, w) * 0.4) }), // 가로로 긴 송장 바코드용
        aspectRatio: 1.333,
      },
      code => {
        const now = Date.now();
        if (code === lastCode && now - lastAt < 2500) return; // 같은 송장 연속 인식 방지
        lastCode = code; lastAt = now;
        doScan(code);
      });
    $('#camBtn').textContent = '■ 끄기';
    $('#torchBtn').hidden = !canTorch();
    try { localStorage.setItem('sort_cam', '1'); } catch (e) {}
  } catch (e) {
    cam = null; $('#reader').hidden = true;
    const name = (e && (e.name || e)) + '';
    if (/NotAllowed|Permission/i.test(name)) {
      showCamError('카메라 권한이 거부됐습니다. 주소창 왼쪽 자물쇠(또는 설정 > 사이트 설정 > 카메라)에서 이 사이트의 카메라를 "허용"으로 바꾼 뒤 새로고침하세요.');
    } else if (/NotFound|Overconstrained/i.test(name)) {
      showCamError('후면 카메라를 찾을 수 없습니다.');
    } else if (/NotReadable/i.test(name)) {
      showCamError('다른 앱이 카메라를 사용 중입니다. 카메라 앱을 종료하고 다시 시도하세요.');
    } else {
      showCamError('카메라를 열 수 없습니다: ' + name);
    }
  }
}

async function stopCam() {
  if (!cam) return;
  try { await cam.stop(); cam.clear(); } catch (e) {}
  cam = null; torchOn = false;
  $('#reader').hidden = true; $('#torchBtn').hidden = true; $('#camBtn').textContent = '📷 카메라';
  try { localStorage.setItem('sort_cam', '0'); } catch (e) {}
}

function canTorch() {
  try { const c = cam.getRunningTrackCapabilities(); return !!(c && c.torch); } catch (e) { return false; }
}

function showCamError(msg) {
  const el = $('#result');
  el.className = 'result err';
  el.innerHTML = `<div class="r-status">카메라 오류</div><div class="r-sub" style="font-size:15px;color:var(--text)">${esc(msg)}</div>`;
  beep('err');
}

$('#camBtn').onclick = () => cam ? stopCam() : startCam();
$('#torchBtn').onclick = async () => {
  if (!cam) return;
  try { torchOn = !torchOn; await cam.applyVideoConstraints({ advanced: [{ torch: torchOn }] }); $('#torchBtn').textContent = torchOn ? '🔦 끄기' : '🔦 플래시'; }
  catch (e) { torchOn = false; }
};
// 화면이 꺼졌다 켜지면 카메라 다시 연결
document.addEventListener('visibilitychange', () => {
  if (document.hidden && cam) { stopCam().then(() => { try { localStorage.setItem('sort_cam', '1'); } catch (e) {} }); }
  else if (!document.hidden && !cam && !isDesktop) {
    let p = '0'; try { p = localStorage.getItem('sort_cam') || '0'; } catch (e) {}
    if (p === '1') startCam();
  }
});

/* ───────── 실시간 동기화 (3초 폴링) ───────── */
function setSync(text, state) {
  $('#sync').textContent = text;
  $('#dot').className = 'dot' + (state ? ' ' + state : '');
}

async function poll() {
  if (S.polling) return;
  S.polling = true;
  try {
    const u = await run('getUpdates', S.logN);
    if (u.reload) { await loadAll(); S.feed = []; renderFeed(); }
    else {
      let changed = false;
      u.ev.forEach(([at, type, inv, row, who]) => {
        const r = S.byInv.get(inv); if (!r) return;
        if (type === '스캔') Object.assign(r, { scanned: true, at, by: who });
        else if (type === '취소') Object.assign(r, { scanned: false, at: '', by: '' });
        // 내가 방금 올린 이벤트는 피드에 이미 있으므로 중복 추가하지 않음
        const mineIdx = S.feed.findIndex(f => f.mine && f.inv === inv && f.type === type);
        if (mineIdx >= 0) S.feed[mineIdx].mine = false;
        else S.feed.unshift({ at, type, inv, who });
        changed = true;
      });
      S.logN = u.n;
      if (S.feed.length > 200) S.feed.length = 200;
      if (changed) renderAll();
    }
    S.lastSync = Date.now(); S.failCount = 0;
  } catch (e) {
    S.failCount++;
  } finally { S.polling = false; }
}

setInterval(() => {
  if (!document.hidden) poll();
  const ago = Math.round((Date.now() - S.lastSync) / 1000);
  if (S.failCount >= 3) setSync('연결 끊김 · 재시도 중', 'bad');
  else if (S.lastSync) setSync(ago <= 1 ? '실시간 동기화' : `${ago}초 전 동기화`, ago < 10 ? 'on' : 'bad');
}, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

/* ───────── 작업자 ───────── */
function askWho() { $('#whoInput').value = S.who; $('#whoDlg').showModal(); $('#whoInput').focus(); }
$('#whoBtn').onclick = askWho;
$('#whoForm').onsubmit = e => {
  e.preventDefault();
  S.who = $('#whoInput').value.trim(); if (!S.who) return;
  try { localStorage.setItem('sort_who', S.who); } catch (err) {}
  $('#whoName').textContent = S.who; $('#whoDlg').close(); refocus();
};

/* ───────── 연결 설정 ───────── */
$('#connBtn').onclick = openConnDialog;
$('#connCancel').onclick = () => $('#connDlg').close();
$('#connForm').onsubmit = async e => {
  e.preventDefault();
  CFG.url = $('#connUrl').value.trim(); CFG.key = $('#connKey').value.trim();
  try { localStorage.setItem('sort_api_url', CFG.url); localStorage.setItem('sort_api_key', CFG.key); } catch (err) {}
  $('#connDlg').close();
  try { await loadAll(); setSync('실시간 동기화', 'on'); if (!S.who) askWho(); }
  catch (err) { setSync('연결 실패', 'bad'); alert(err.message || err); }
};

/* ───────── 시작 ───────── */
(async () => {
  try { S.who = localStorage.getItem('sort_who') || ''; } catch (e) {}
  $('#whoName').textContent = S.who || '-';
  if (!CFG.url || !CFG.key) { setSync('연결 정보 없음', 'bad'); openConnDialog(); return; }
  try { await loadAll(); setSync('실시간 동기화', 'on'); }
  catch (e) { setSync('불러오기 실패', 'bad'); alert(e.message || e); }
  if (!S.who) askWho(); else refocus();
  // 휴대폰에서 지난번에 카메라를 쓰고 있었다면 자동으로 켜기
  let camPref = '0';
  try { camPref = localStorage.getItem('sort_cam') || '0'; } catch (e) {}
  if (!isDesktop && camPref === '1' && S.who) startCam();
})();
</script>
